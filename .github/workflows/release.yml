name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Update .toc version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/^## Version: .*/## Version: ${VERSION}/" GearExport.toc GearExport-BCC.toc

      # Vanilla 1.12 package: the repo .toc as-is (Interface 11200).
      - name: Package vanilla addon
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          rm -rf build/vanilla/GearExport
          mkdir -p build/vanilla/GearExport
          cp GearExport.toc GearExport.xml GearExport.lua README.md build/vanilla/GearExport/
          (cd build/vanilla && zip -r "../../GearExport-${VERSION}-vanilla.zip" GearExport/)

      # TBC package: 2.4.3 clients predate the .toc suffix scheme and only read
      # GearExport.toc, so that one carries Interface 20400. Burning Crusade
      # Classic prefers the suffixed GearExport-BCC.toc (20504) and ignores the
      # other, so both clients load without an "out of date" warning.
      - name: Package TBC addon
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          rm -rf build/tbc/GearExport
          mkdir -p build/tbc/GearExport
          cp GearExport.toc GearExport-BCC.toc GearExport.xml GearExport.lua README.md build/tbc/GearExport/
          sed -i "s/^## Interface: .*/## Interface: 20400/" build/tbc/GearExport/GearExport.toc
          (cd build/tbc && zip -r "../../GearExport-${VERSION}-tbc.zip" GearExport/)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            GearExport-${{ steps.version.outputs.VERSION }}-vanilla.zip
            GearExport-${{ steps.version.outputs.VERSION }}-tbc.zip
