name: Release

on:
  push:
    tags:
      - "v*"
  # Manual fallback: a tag push that lands during a GitHub Actions outage is
  # never replayed, so a release has to be startable without retagging.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.4.0)"
        required: true
        type: string
      ref:
        description: "Branch, tag or SHA to build from. Defaults to the branch this is run from."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Empty falls back to the triggering ref, which is what a tag push wants.
          ref: ${{ inputs.ref }}

      # On a tag push GITHUB_REF_NAME is the tag; on a manual run it is the
      # branch name, so the input takes precedence there.
      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          VERSION="${VERSION#v}"
          if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::'${VERSION}' is not a valid version (expected 1.4 or 1.4.0)"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Update .toc version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/^## Version: .*/## Version: ${VERSION}/" GearExport.toc GearExport-BCC.toc

      # Vanilla 1.12 package: the repo .toc as-is (Interface 11200).
      - name: Package vanilla addon
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          rm -rf build/vanilla/GearExport
          mkdir -p build/vanilla/GearExport
          cp GearExport.toc GearExport.xml GearExport.lua README.md build/vanilla/GearExport/
          (cd build/vanilla && zip -r "../../GearExport-${VERSION}-vanilla.zip" GearExport/)

      # TBC package: 2.4.3 clients predate the .toc suffix scheme and only read
      # GearExport.toc, so that one carries Interface 20400. Burning Crusade
      # Classic prefers the suffixed GearExport-BCC.toc (20504) and ignores the
      # other, so both clients load without an "out of date" warning.
      - name: Package TBC addon
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          rm -rf build/tbc/GearExport
          mkdir -p build/tbc/GearExport
          cp GearExport.toc GearExport-BCC.toc GearExport.xml GearExport.lua README.md build/tbc/GearExport/
          sed -i "s/^## Interface: .*/## Interface: 20400/" build/tbc/GearExport/GearExport.toc
          (cd build/tbc && zip -r "../../GearExport-${VERSION}-tbc.zip" GearExport/)

      # tag_name is required for manual runs, where the triggering ref is a
      # branch rather than a tag. The action creates the tag if it is missing.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          files: |
            GearExport-${{ steps.version.outputs.VERSION }}-vanilla.zip
            GearExport-${{ steps.version.outputs.VERSION }}-tbc.zip
