name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Update .toc version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/^## Version: .*/## Version: ${VERSION}/" GearExport.toc

      - name: Package addon
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p GearExport
          cp GearExport.toc GearExport.xml GearExport.lua README.md GearExport/
          zip -r "GearExport-${VERSION}.zip" GearExport/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "GearExport-${{ steps.version.outputs.VERSION }}.zip"
